[package]
name = "scry"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "TUI process inspector for Linux. Memory map, threads, fds, limits, cgroup, kernel stack, syscall trace."
repository = "https://github.com/dcantah/scry"

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive"] }
crossterm = "0.28.1"
libc = "0.2.174"
ratatui = "0.29.0"

[profile.release]
lto = "thin"
codegen-units = 1
